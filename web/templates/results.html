<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Результаты конкурса</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/webapp.css">
</head>
<body>
    <div id="app">
        <div style="padding: 2rem; text-align: center; color: #fff;">
            Загрузка...
        </div>
    </div>
    <script>
        // Проверка загрузки Vue перед загрузкой модуля
        window.addEventListener('load', function() {
            console.log('Page loaded, Vue available:', typeof Vue !== 'undefined');
            if (typeof Vue === 'undefined') {
                document.getElementById('app').innerHTML = '<div style="padding: 2rem; color: red; text-align: center;">Ошибка: Vue.js не загружен. Проверьте подключение к интернету.</div>';
            }
        });
    </script>
    <script type="module" src="/static/js/results.js"></script>
</body>
</html>
