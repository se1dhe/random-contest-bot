<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Загрузка...</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/webapp.css">
</head>
<body>
    <div style="padding: 2rem; text-align: center; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0a0a0f;">
        <div>Загрузка...</div>
    </div>
    <script>
        (function() {
            // Проверяем доступность Telegram WebApp API
            if (typeof Telegram === 'undefined' || !Telegram.WebApp) {
                document.body.innerHTML = '<div style="padding: 2rem; text-align: center; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0a0a0f;"><div>Ошибка: Откройте страницу через Telegram</div></div>';
                return;
            }
            
            const tg = Telegram.WebApp;
            tg.ready();
            tg.expand();
            
            // Получаем initData
            const initData = tg.initData;
            
            if (!initData) {
                document.body.innerHTML = '<div style="padding: 2rem; text-align: center; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0a0a0f;"><div>Ошибка: Не удалось получить данные авторизации</div></div>';
                return;
            }
            
            // Отправляем initData на сервер для рендеринга
            fetch('/api/webapp/render', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ initData: initData })
            })
            .then(response => response.text())
            .then(html => {
                document.open();
                document.write(html);
                document.close();
            })
            .catch(error => {
                console.error('Ошибка загрузки страницы:', error);
                document.body.innerHTML = '<div style="padding: 2rem; text-align: center; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0a0a0f;"><div>Ошибка загрузки страницы</div></div>';
            });
        })();
    </script>
</body>
</html>
