<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Результаты | {{ contest.title }}</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="/static/css/webapp.css">
    <style>
        .winner-grid {
            display: grid;
            gap: 1rem;
        }

        #results-loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            gap: 1rem;
        }

        .prize-highlight {
            background: linear-gradient(135deg, rgba(124, 139, 255, 0.2) 0%, rgba(159, 122, 234, 0.2) 100%);
            border: 1px solid var(--accent);
            padding: 1.5rem;
            border-radius: 20px;
            text-align: center;
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border {
            0% {
                box-shadow: 0 0 0 0 rgba(124, 139, 255, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(124, 139, 255, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(124, 139, 255, 0);
            }
        }
    </style>
</head>

<body>
    <div class="webapp-container">
        <div class="webapp-content">
            <div id="results-loader">
                <div class="spinner"></div>
                <p class="muted">Загружаем результаты...</p>
            </div>

            <div id="results-content" style="display: none;">
                <div id="user-status" class="mb-5"></div>

                <h2 class="webapp-header-title mb-3">🎉 Список победителей</h2>
                <div id="winners-list" class="winner-grid"></div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        async function init() {
            try {
                const response = await fetch(`/api/contests/{{ contest.id }}/results-info?user_id=${tg.initDataUnsafe.user.id}`, {
                    headers: { 'X-Telegram-Init-Data': tg.initData }
                });
                const data = await response.json();

                document.getElementById('results-loader').style.display = 'none';
                document.getElementById('results-content').style.display = 'block';

                renderResults(data);
            } catch (e) {
                console.error(e);
            }
        }

        function renderResults(data) {
            const statusDiv = document.getElementById('user-status');
            const winnersList = document.getElementById('winners-list');

            if (data.user_prize) {
                statusDiv.innerHTML = `
                    <div class="prize-highlight">
                        <div style="font-size: 3rem; margin-bottom: 1rem;">🏆</div>
                        <h1 class="status-title">Поздравляем!</h1>
                        <p class="status-description">Вы заняли <strong>${data.user_prize.place} место</strong></p>
                        <p class="muted mt-2">Приз: ${data.user_prize.title}</p>
                    </div>
                `;
                confetti({
                    particleCount: 200,
                    spread: 80,
                    origin: { y: 0.7 }
                });
            } else if (data.is_participant) {
                statusDiv.innerHTML = `
                    <div class="content-card text-center">
                        <h2 class="status-title">Спасибо за участие!</h2>
                        <p class="status-description">В этот раз удача улыбнулась другим, но не сдавайтесь!</p>
                    </div>
                `;
            }

            if (data.winners && data.winners.length > 0) {
                winnersList.innerHTML = data.winners.map(w => `
                    <div class="winner-card ${w.place <= 3 ? 'top-winner' : ''}">
                        <div class="winner-place">
                            ${w.place === 1 ? '🥇' : w.place === 2 ? '🥈' : w.place === 3 ? '🥉' : '🏆'}
                            ${w.place} место
                        </div>
                        <div class="winner-prize">${w.title}</div>
                        <div class="winner-name">
                            ${w.winner_username ? '@' + w.winner_username : w.winner_firstname}
                        </div>
                    </div>
                `).join('');
            } else {
                winnersList.innerHTML = '<p class="muted text-center">Победители еще не определены</p>';
            }
        }

        init();
    </script>
</body>

</html>
