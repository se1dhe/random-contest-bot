<!DOCTYPE html>
<html lang="{{ language or 'ru' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t("download_page.error.generic") if t else "Ошибка" }} - Se1dhe Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="card text-center" style="max-width: 28rem;">
        <div class="text-6xl mb-4">❌</div>
        <h1 class="text-2xl font-bold text-error mb-4">{{ t("download_page.error.generic") if t else "Ошибка скачивания" }}</h1>
        <p class="text-primary mb-6">{{ error }}</p>
        <p class="text-secondary text-sm">
            {{ t("download_page.support") if t else "Если проблема сохраняется, обратитесь в поддержку." }}
        </p>
    </div>
</body>
</html>
