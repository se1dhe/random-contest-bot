services:
  postgres:
    image: postgres:15-alpine
    container_name: contest_bot_postgres
    environment:
      POSTGRES_DB: contest_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Europe/Kyiv
      PGTZ: Europe/Kyiv
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contest_network

  redis:
    image: redis:7-alpine
    container_name: contest_bot_redis
    environment:
      - TZ=Europe/Kyiv
    command: redis-server --notify-keyspace-events Ex
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contest_network

  bot:
    build: .
    container_name: contest_bot_bot
    command: python -m bot.main
    volumes:
      - .:/app
      - /app/__pycache__
    environment:
      - PYTHONPATH=/app
      - TZ=Europe/Kyiv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - contest_network

  web:
    build: .
    container_name: contest_bot_web
    command: python -m web.main
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
    environment:
      - PYTHONPATH=/app
      - WEBAPP_URL=http://web:8000
      - TZ=Europe/Kyiv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - contest_network

networks:
  contest_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
